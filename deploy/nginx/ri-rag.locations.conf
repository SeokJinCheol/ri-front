# Include inside the existing localhost server block, alongside /yeodong/.
location = /ri-rag {
    return 301 /ri-rag/$is_args$args;
}

location = /ri-rag/api {
    return 308 /ri-rag/api/$is_args$args;
}

location ^~ /ri-rag/api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 11m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

location ^~ /ri-rag/assets/ {
    alias /Users/seokjincheol/workspace/ri-project/ri-front/dist/assets/;
}

location /ri-rag/ {
    alias /Users/seokjincheol/workspace/ri-project/ri-front/dist/;
    index index.html;
    try_files $uri $uri/ /ri-rag/index.html;
    add_header Cache-Control "no-cache";
}
